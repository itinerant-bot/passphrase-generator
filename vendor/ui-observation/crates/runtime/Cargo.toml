[package]
name = "ui-observation-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
ui-observation-protocol = { path = "../protocol" }
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "allow"
