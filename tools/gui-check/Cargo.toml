[package]
name = "four-words-gui-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
four-words = { path = "../.." }
getrandom = "0.4"
ui-observation-protocol = { path = "../../vendor/ui-observation/crates/protocol" }
ui-observation-runtime = { path = "../../vendor/ui-observation/crates/runtime" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
