[package]
name = "four-words"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Memorable multilingual passphrases within a character limit"
license = "MIT"
default-run = "four-words-gui"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:ui-observation-egui-031", "dep:ui-observation-protocol", "dep:ui-observation-runtime", "dep:winresource"]
packaging = ["dep:zip", "dep:serde_json"]

[[bin]]
name = "four-words-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "package-windows"
path = "tools/package_windows.rs"
required-features = ["packaging"]

[[bin]]
name = "package-release"
path = "tools/package_release.rs"
required-features = ["packaging"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
num-bigint = "0.4"
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
ui-observation-egui-031 = { path = "vendor/ui-observation/crates/egui-031", optional = true }
ui-observation-protocol = { path = "vendor/ui-observation/crates/protocol", optional = true }
ui-observation-runtime = { path = "vendor/ui-observation/crates/runtime", optional = true }
zip = { version = "2.4", optional = true, default-features = false, features = ["deflate"] }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
winresource = { version = "0.1.31", optional = true, default-features = false }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
eframe = { path = "vendor/ui-observation/crates/eframe-031" }
epaint = { path = "vendor/ui-observation/crates/epaint-031" }
