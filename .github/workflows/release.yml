name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Verify release version
        run: |
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read package version." }
          $version = ($metadata.packages | Where-Object name -eq 'four-words').version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version."
          }

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Test
        run: cargo +stable test --release --all-features --locked

      - name: Build portable Windows package
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "Could not select Rust toolchain." }
          cargo run --release --locked --no-default-features --features packaging --bin package-windows -- x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed." }

      - name: Prepare download and checksum
        run: |
          $packages = @(Get-ChildItem dist/four-words-*-windows-x64.zip)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows ZIP." }
          Copy-Item $packages[0].FullName dist/four-words-windows-x64.zip
          $hash = (Get-FileHash dist/four-words-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/SHA256SUMS.txt'),
            "$hash  four-words-windows-x64.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/four-words-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release-assets

      - name: Verify checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/four-words-windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Four Words $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
