name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libxcb1-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target "${{ matrix.target }}"
          rustup default stable

      - name: Verify release version
        run: |
          python - <<'PYTHON'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1'
          ]))
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'four-words')
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must match Cargo.toml version ' + version)
          PYTHON

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --release --all-features --locked --target "${{ matrix.target }}"

      - name: Build desktop package
        run: cargo run --release --locked --no-default-features --features packaging --bin package-release -- "${{ matrix.target }}"

      - name: Smoke-test packaged CLI and prepare download
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess
          platform = os.environ['RELEASE_PLATFORM']
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1'
          ]))
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'four-words')
          folder = pathlib.Path('dist') / f'four-words-{version}-{platform}'
          cli = folder / ('four-words.exe' if platform.startswith('windows') else 'four-words')
          subprocess.run([str(cli.resolve()), '--dict', 'efgsl', '--len', '24'], check=True)
          if platform.startswith('macos'):
              subprocess.run(['plutil', '-lint', str(folder / 'Four Words.app/Contents/Info.plist')], check=True)
          shutil.copyfile(pathlib.Path(str(folder) + '.zip'), pathlib.Path('dist') / f'four-words-{platform}.zip')
          PYTHON

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/four-words-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Verify downloads and generate checksums
        working-directory: release-assets
        run: |
          test -f four-words-windows-x64.zip
          test -f four-words-linux-x64.zip
          test -f four-words-macos-arm64.zip
          test -f four-words-macos-x64.zip
          for archive in *.zip; do unzip -tq "$archive"; done
          sha256sum *.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Four Words $RELEASE_TAG" \
            --notes-file .github/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
